# PRE-REGISTRO RIE-02. Se sella (sha256) ANTES de producir cualquier resultado.
# Cambiarlo después invalida la corrida: run_all.py aborta si el hash no coincide.
version: 6

enmiendas:   # E1-E4 se hicieron ANTES del ciego 1 y de la semilla 777; E5 DESPUES del ciego 1; E6 DESPUES del ciego 2 y de la semilla 777
  - id: E6
    hash_anterior: 8a238067aeba9eafacf217a6daa42207d453f6a17e774ea5c0cbf7f84beb555c
    cambio: "SIN cambios de parametros ni de metodo. (a) Se congela el codigo corregido por la auditoria (determinismo: claves ordenadas; aristas aproximadas solo a distancia de edicion exactamente 1 y una arista por par y tipo; guardia contra repetir un ciego; ver bloque codigo_congelado). (b) Se agregan los criterios C7 y C8 para dos conjuntos externos (A y B) generados por un tercero con la verdad cifrada."
    motivo: "La auditoria posterior a la semilla 777 y al ciego 2 hallo dos defectos reales en el codigo que produjo esos resultados oficiales (union a distancia 2 con aristas duplicadas, y no determinismo por orden de conjuntos). Esas corridas NO se repiten: sus cifras quedan como se publicaron (sha en README, seccion fe de erratas; v5 sellado en results/previo_v5/). El codigo corregido es v6. Con v6 el desarrollo (202) ya no cumple C1 (0.45 vs 0.26; IC inferior -0.0097): se declara y no se ajusta nada. v6 se evalua UNA sola vez en los conjuntos A y B, que no existian cuando se congelo el codigo ni los parametros. Autorizacion escrita de Gino: 25-nov-2026 ('autorizo')."
  - id: E5
    hash_anterior: 7576ecdad989de11559a749b4943401e0664a7a2df52a40a2f215f8a712123d5
    cambio: "(a) tres tipos de arista aproximada (telefono_aprox, direccion_hogar_aprox, direccion_negocio_aprox: textos a distancia de edicion <=1, claves de borrado, largo >=6, exclusion de igualdad exacta) con pesos 0.5/0.35/0.3; (b) rasgos de sorpresa estadistica sin etiquetas (sorp_pares, sorp_valores, sorp_total, sorp_media) y metodo 'sorpresa' (ordena por sorp_media, sin modelo ni puerta); (c) Louvain recursivo: ninguna comunidad supera dividir_componentes_mayores_a (antes parte una sola vez y quedaban de hasta 126); (d) pesos de aristas redondeados a 6 decimales antes de Louvain (networkx 3.7 ciclaba para siempre en el corte 165 del ciego); (e) criterios C5 y C6"
    motivo: "El ciego 1 (data/ciego, ya visto) dio precision 0.00 y recall 0.00 del sistema (regla exacta: 0.10 / 0.05). El diagnostico POSTERIOR mostro casos demasiado grandes (a, c) y un modelo supervisado entrenado solo con el generador propio. E5 se decidio DESPUES de ver ese resultado y por eso el ciego 1 ya no sirve para validar: queda como dato informativo. El ciego 2 (data/ciego2, escrito por otro agente sin acceso al detector) y la semilla 777 NO se han corrido al sellar E5. Los parametros de E5 se fijaron sin ajustarlos contra ningun ciego."
  - id: E3
    hash_anterior: 7e08d8e7dce1013c610024388dfa4156bedcc8464f56f3d6235291b760afe1d7
    cambio: "criterio C2: de 'grupos legitimos en cola / grupos legitimos totales' a 'fraccion de la COLA que son grupos legitimos (cola_legit_grupo)'; mismo umbral 0.05"
    motivo: "Auditoria de bugs: con el denominador anterior (~1040 grupos) y k=50, C2 no podia fallar nunca (maximo 0.048). El umbral no se toca para no ajustarlo a lo ya visto; se espera que NO cumpla (en desarrollo la cola era 42% grupos legitimos)."
  - id: E4
    hash_anterior: 7e08d8e7dce1013c610024388dfa4156bedcc8464f56f3d6235291b760afe1d7
    cambio: "casos de asesor: asesor_z pasa a ser z de VOLUMEN (solicitudes en la ventana vs esperado por su historia propia, con prior de F dias a la tasa global); se elimina caso_asesor.prior_tasa (la prior_fuerza queda como dias de prior)"
    motivo: "Auditoria de bugs: la familia relacional del caso de asesor era la tasa de las mismas marcas conductuales que forman el caso y el compuesto conductual, o sea una sola senal contada dos veces. Ahora: senal 1 = salto de volumen (no conductual); senal 2 = >=5 solicitudes con marcas conductuales."
  - id: E2
    hash_anterior: 66efb2cb9c6a8a52aa3e41470d032d5d04bf05e89edff2d4b771e36302c1d274
    cambio: "nueva semilla de calibracion (303) y puerta.alertas_max_por_1000 = 1.0; la cola de lgbm_puerta solo incluye casos con puntaje > score_minimo"
    motivo: "En desarrollo (202) la cola se llenaba siempre hasta el presupuesto: con CERO anillos daba 4.07 alertas por 1000 solicitudes (C3 no cumplia). Un sistema debe poder no alertar. score_minimo = primer puntaje excluido cuando, en un mundo SIN anillos de semilla distinta (303) y tras la puerta, solo se permiten 1.0 alertas por 1000 solicitudes. Solo usa el mundo de calibracion."
  - id: E1
    hash_anterior: 646536c78394680f738a8b1558353ceeb0ab7683d7fecc9bafa1fa7336183f24
    cambio: "puerta.percentil_conductual 90 -> 75"
    motivo: "En el mundo de ENTRENAMIENTO (semilla 101) el percentil 90 dejaba pasar solo 54% de los casos de anillo verdaderos y el 75 pasa 88%. Eleccion hecha mirando etiquetas del mundo de entrenamiento (permitido: ahi se ajusta la puerta). Visto tambien en desarrollo (202): con p90 la cola quedaba en precision 0.22 / recall 0.20."

semillas:
  entrenamiento: 101   # el modelo y la puerta se ajustan solo aquí
  calibracion: 303     # mundo SIN anillos: fija score_minimo (ver E2)
  desarrollo: 202      # depuración y arreglo de errores
  evaluacion: 777      # NO se corre hasta terminar la revisión de errores

cortes_dias: [45, 60, 75, 90, 105, 120, 135, 150, 165, 179]   # instantáneas "a la fecha"
corte_final: 179

presupuesto:
  fraccion_solicitudes: 0.004   # casos revisables por instantánea = ceil(0.4 % de solicitudes)
  solapamiento_dedupe: 0.8      # un caso contenido >=80 % en otro mejor puntuado se descarta

grafo:
  tope_compartido: 12           # un valor compartido por >12 solicitudes es "nodo concentrador" y se excluye
  peso_formula: "peso_tipo / sqrt(k - 1)"   # k = solicitudes que comparten el valor
  pesos:
    telefono: 1.0
    dispositivo: 0.8
    direccion_hogar: 0.7
    direccion_negocio: 0.6
    negocio: 0.8
    referencia: 0.8
    telefono_aprox: 0.5          # E5: mitad del peso del exacto, sin ajustar
    direccion_hogar_aprox: 0.35
    direccion_negocio_aprox: 0.3
  dividir_componentes_mayores_a: 25   # Louvain (semilla fija) RECURSIVO: ninguna comunidad supera este tamano si se puede partir (E5)

caso_asesor:
  ventana_dias: 21
  min_solicitudes_marcadas: 5
  # solicitud marcada: domicilio no verificado, o z(ratio_monto) > 1.5, o z(log tiempo) < -1.5
  umbral_z_marca: 1.5
  prior_fuerza: 10              # días de prior (a la tasa global) para la línea base de volumen del asesor (E4)

etiqueta_caso:
  min_solicitudes_anillo: 3
  pureza_minima: 0.5            # >=50 % de las solicitudes del caso son del mismo anillo

puerta:        # una alerta exige DOS familias de señal independientes
  percentil_relacional: 75      # familia relacional/organizacional (peso medio de aristas; z del asesor en casos de asesor)
  percentil_conductual: 75      # familia conductual (compuesto de z de tiempo, ratio, domicilio y horario)
  asesor_z_minimo: 2.0
  alertas_max_por_1000: 1.0     # objetivo de falsas alertas en el mundo de calibracion (ver E2)

modelo:
  lightgbm:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 8
    min_child_samples: 10
    is_unbalance: true
    deterministic: true
    force_row_wise: true
    n_jobs: 1

criterios:     # afirmaciones falsables; se reportan se cumplan o no
  C1: "LightGBM+puerta supera a regla_exacta_con_tope en precision@presupuesto: limite inferior IC95% de la diferencia > 0"
  C2: "fraccion de la COLA que son grupos legitimos multi-solicitud <= 0.05 (enmienda E3)"
  C3: "mundo sin anillos: alertas <= 2.0 por 1000 solicitudes"
  C4: "recall de anillos de tipologias 1-3 en la cola final >= 0.5"
  C5: "ciego 2 (data/ciego2, corrido una sola vez): lgbm_puerta supera a regla_exacta_con_tope en precision@presupuesto, limite inferior IC95% de la diferencia > 0 (enmienda E5)"
  C6: "validacion dejando una tipologia fuera (mundo de desarrollo 202, corte final): el recall medio de la tipologia retenida de lgbm_sin_puerta >= el de regla_exacta_con_tope (enmienda E5)"
  C7: "conjunto externo A (generado por un tercero, verdad cifrada, corrido una sola vez con el codigo v6): lgbm_puerta supera a regla_exacta_con_tope en precision@presupuesto, limite inferior IC95% de la diferencia > 0 (enmienda E6)"
  C8: "conjunto externo B (idem, sin tipologias en comun con A): misma condicion que C7 (enmienda E6)"
  # En la salida de run_all para A y B la clave se llama C5_cumple (es el mismo calculo); corresponde a C7 y C8 respectivamente.
  solo_reporte: ["tipologia colusion_asesor", "tipologia sin_atributos", "anticipacion", "barrido de parametros", "conjunto ciego 1 (ya visto)", "metodo sorpresa vs regla_exacta_con_tope en ciego 2, en evaluacion, en A y en B", "lgbm_sin_puerta y lgbm_solo_relacional en A y B", "desarrollo y LOTO con codigo v6 (informativos, no oficiales)"]

